# ============================================================================
# CONTINUOUS INTEGRATION
# ----------------------------------------------------------------------------
# WHAT THIS IS: a checklist GitHub runs automatically on its own servers every
# time someone opens a pull request or pushes to main. If any step fails, the
# PR is marked with a red ✗ and you get an email.
#
# WHAT YOU HAVE TO DO TO "SET IT UP": nothing. There is no dashboard to
# configure. GitHub finds any file under .github/workflows/ and runs it. This
# file starts working the moment it is pushed.
#
# WHY IT MATTERS FOR A GROUP PROJECT: it catches the "it works on my machine"
# problem. The build runs on a clean Linux box with a fresh install, so a
# missing dependency or a type error cannot hide behind your local cache.
#
# NO SECRETS ARE NEEDED. The app builds without Supabase credentials because
# src/lib/supabase.ts tolerates missing env vars and falls back to mock data.
# ============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run if you push again to the same branch — saves
# minutes and gives you results for the latest commit only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies — it is
      # stricter and faster than `npm install`, and it fails loudly if the
      # lockfile is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
